<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Store | 2026</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body { font-family: 'Inter', sans-serif; }
</style>
</head>

<body class="bg-gray-100">

<!-- Navbar -->
<header class="bg-black text-white p-4 flex justify-between items-center">
  <h1 class="text-xl font-bold">YourStore</h1>
  <button onclick="toggleCart()" class="bg-cyan-500 px-4 py-2 rounded">Cart (<span id="cart-count">0</span>)</button>
</header>

<!-- Products -->
<section class="p-8 grid md:grid-cols-3 gap-8">
  
  <div class="bg-white p-6 rounded shadow">
    <img src="https://via.placeholder.com/300" class="rounded">
    <h2 class="text-xl font-semibold mt-4">Product 1</h2>
    <p class="text-gray-500">₹999</p>
    <button onclick="addToCart('Product 1',999)" class="mt-4 bg-black text-white px-4 py-2 rounded w-full">Add to Cart</button>
  </div>

  <div class="bg-white p-6 rounded shadow">
    <img src="https://via.placeholder.com/300" class="rounded">
    <h2 class="text-xl font-semibold mt-4">Product 2</h2>
    <p class="text-gray-500">₹1499</p>
    <button onclick="addToCart('Product 2',1499)" class="mt-4 bg-black text-white px-4 py-2 rounded w-full">Add to Cart</button>
  </div>

  <div class="bg-white p-6 rounded shadow">
    <img src="https://via.placeholder.com/300" class="rounded">
    <h2 class="text-xl font-semibold mt-4">Product 3</h2>
    <p class="text-gray-500">₹1999</p>
    <button onclick="addToCart('Product 3',1999)" class="mt-4 bg-black text-white px-4 py-2 rounded w-full">Add to Cart</button>
  </div>

</section>

<!-- Cart Drawer -->
<div id="cart" class="fixed right-0 top-0 w-80 h-full bg-white shadow-lg p-6 hidden overflow-y-auto">
  <h2 class="text-xl font-bold mb-4">Your Cart</h2>
  <div id="cart-items"></div>
  <hr class="my-4">
  <p class="font-semibold">Total: ₹<span id="total">0</span></p>
  <button onclick="checkout()" class="mt-4 bg-cyan-500 text-black px-4 py-2 rounded w-full">Checkout</button>
</div>

<script>
let cart = [];
let total = 0;

function addToCart(name, price) {
  cart.push({name, price});
  total += price;
  document.getElementById('cart-count').innerText = cart.length;
  updateCart();
}

function updateCart() {
  let cartItems = document.getElementById('cart-items');
  cartItems.innerHTML = "";
  cart.forEach(item => {
    cartItems.innerHTML += `<p>${item.name} - ₹${item.price}</p>`;
  });
  document.getElementById('total').innerText = total;
}

function toggleCart() {
  document.getElementById('cart').classList.toggle('hidden');
}

function checkout() {
  var options = {
    "key": "YOUR_RAZORPAY_KEY_ID",
    "amount": total * 100,
    "currency": "INR",
    "name": "YourStore",
    "description": "Purchase Payment",
    "handler": function (response){
        alert("Payment Successful! Payment ID: " + response.razorpay_payment_id);
    },
    "theme": { "color": "#06b6d4" }
  };
  var rzp1 = new Razorpay(options);
  rzp1.open();
}
</script>

</body>
</html>
